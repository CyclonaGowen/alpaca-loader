<!DOCTYPE html>
<html>
<head>
  <title>Alpaca Loader</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <h2>📈 Alpaca Loader</h2>

      <nav>
        <p class="active">Dashboard</p>
        <p>Watchlist</p>
        <p>Alerts</p>
        <p>News</p>
        <p>Settings</p>
      </nav>

      <div class="paper-box">
        <strong>Paper Trading</strong>
        <p>Buying Power</p>
        <h3>$100,000.00</h3>
      </div>
    </aside>

    <main class="main">
      <header>
        <input id="tickerInput" placeholder="Search ticker, ex: AAPL">
        <button onclick="loadStock()">Load Data</button>
      </header>

      <section class="top-row">
        <div class="chart-card">
          <h1 id="tickerTitle">AAPL</h1>
          <div id="chart"></div>
        </div>

        <div class="info-card">
          <h2 id="priceTitle">--</h2>
          <p id="stockStatus">Enter a ticker to load data</p>
        </div>
      </section>

      <section class="data-card">
        <h3>Recent Data</h3>
        <table>
          <thead>
            <tr>
              <th>Date</th>
              <th>Open</th>
              <th>High</th>
              <th>Low</th>
              <th>Close</th>
              <th>Volume</th>
            </tr>
          </thead>
          <tbody id="stockTable"></tbody>
        </table>
      </section>
    </main>
  </div>

<script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>

  <script>
  const chart = LightweightCharts.createChart(document.getElementById("chart"), {
    height: 300,
    layout: {
      background: { color: "#0d1828" },
      textColor: "#d1d5db",
    },
    grid: {
      vertLines: { color: "#1f2937" },
      horzLines: { color: "#1f2937" },
    },
  });

  const candleSeries = chart.addSeries(LightweightCharts.CandlestickSeries);

  async function loadStock() {
    const ticker = document.getElementById("tickerInput").value || "AAPL";

    const response = await fetch(`/api/stocks/${ticker}`);
    const result = await response.json();

    document.getElementById("tickerTitle").textContent = result.ticker;

    const chartData = result.data.map(row => ({
      time: row.date.split("T")[0],
      open: row.open,
      high: row.high,
      low: row.low,
      close: row.close,
    }));

    candleSeries.setData(chartData);
    chart.timeScale().fitContent();

    const table = document.getElementById("stockTable");
    table.innerHTML = "";

    const latest = result.data[result.data.length - 1];

    document.getElementById("priceTitle").textContent = `$${latest.close}`;
    document.getElementById("stockStatus").textContent = `${result.ticker} latest close price`;

    result.data.slice(-5).forEach(row => {
      table.innerHTML += `
        <tr>
          <td>${row.date.split("T")[0]}</td>
          <td>${row.open}</td>
          <td>${row.high}</td>
          <td>${row.low}</td>
          <td>${row.close}</td>
          <td>${row.volume}</td>
        </tr>
      `;
    });
  }

  loadStock();
</script>
</body>
</html>
